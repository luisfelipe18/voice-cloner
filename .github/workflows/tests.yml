name: Tests and privacy
on: [push, pull_request]
jobs:
  source-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_repository.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libsndfile1
      - run: python backend/install_engine.py
      - run: uv venv backend/.venv-vc
      - run: uv pip install --python backend/.venv-vc/bin/python torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --python backend/.venv-vc/bin/python -r backend/requirements-vc.txt -r backend/requirements-rvc.txt --override backend/constraints-vc.txt
      - run: .venv-vc/bin/python -m pytest tests -q
        working-directory: backend
